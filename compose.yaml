services:
  postgres:
    image: postgres:18
    container_name: gigahack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    # Keep the server minor version in step with qdrant-client in Manage Data/requirements.txt.
    image: qdrant/qdrant:v1.19.1
    container_name: gigahack-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  llm:
    build: ./Manage Data
    restart: unless-stopped
    environment:
      CHAT_MODE: ${CHAT_MODE:-live}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_STT_MODEL: ${OPENROUTER_STT_MODEL:-openai/whisper-large-v3-turbo}
      OPENROUTER_TTS_MODEL: ${OPENROUTER_TTS_MODEL:-microsoft/mai-voice-2-flash}
      OPENROUTER_TTS_VOICE: ${OPENROUTER_TTS_VOICE:-en-US-Harper:MAI-Voice-2}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:${LLM_PORT:-8000}:8000"
    volumes:
      - llm_traces:/app/data/10_traces
    depends_on:
      qdrant:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      LLM_SERVICE_URL: http://llm:8000
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://staging.faflist.solutions}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: gigahack-postgres18-data
  qdrant_data:
    name: gigahack-qdrant-data
  llm_traces:
    name: gigahack-llm-traces
